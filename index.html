<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chameleon</title>
<meta name="description" content="Doorgeef party-game: vind de chameleon.">
<meta name="theme-color" content="#F1FBF3">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Chameleon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1B4D33;
  --soft:#63917A;
  --line:#D8EEDF;
  --mint:#BDE9CC;
  --green:#2FB566;
  --green-dark:#1F8F4C;
  --chip:#E7F7EC;
  --coral:#FF6B6B;
  --coral-soft:#FFE3E3;
  --orange:#F59F3B;
}
*{box-sizing:border-box}
html{background:linear-gradient(180deg,#F1FBF3,#DDF3E2) fixed}
html,body{margin:0;padding:0}
body{
  color:var(--ink);
  font-family:'Baloo 2',ui-rounded,'Segoe UI',system-ui,-apple-system,sans-serif;
  font-size:16px;line-height:1.5;min-height:100dvh;
  padding-top:env(safe-area-inset-top);
  padding-bottom:calc(18px + env(safe-area-inset-bottom));
  -webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;
}
/* zachte blobs op de achtergrond */
body::before,body::after{content:'';position:fixed;border-radius:50%;z-index:-1;pointer-events:none}
body::before{width:380px;height:380px;background:#CBEFD9;top:-150px;right:-130px;opacity:.55}
body::after{width:320px;height:320px;background:#D6F2DE;bottom:-130px;left:-120px;opacity:.6}

#topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:14px 18px 2px;max-width:520px;margin:0 auto}
#tb-left{font-weight:800;font-size:20px}
#tb-right{background:#fff;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;
  color:var(--soft);box-shadow:0 2px 8px rgba(27,77,51,.08)}
main#screen{padding:12px 16px 30px;max-width:520px;margin:0 auto}
.stack{display:flex;flex-direction:column;gap:14px}
.center{text-align:center}
h1,h2,p{margin:0}
.title{font-size:38px;font-weight:800;letter-spacing:-.5px;margin-top:6px}
.h2{font-size:22px;font-weight:800}
.small{font-size:13px}
.label{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);margin-bottom:6px}
.card{background:#fff;border-radius:22px;padding:16px;box-shadow:0 8px 22px rgba(27,77,51,.08)}
.card p{margin:6px 0}
.chip{display:inline-block;background:var(--chip);color:var(--green-dark);border-radius:999px;
  padding:4px 12px;font-weight:800;font-size:13px}
.note{background:#FFF4D9;color:#7A5C1E;border-radius:18px;padding:12px 14px;font-size:14px;
  box-shadow:0 4px 14px rgba(122,92,30,.08)}

/* speelse "drukbare" knoppen */
.btn{display:block;width:100%;border:0;border-radius:18px;padding:15px 14px;
  font:inherit;font-weight:800;font-size:17px;color:#fff;background:var(--green);
  box-shadow:0 5px 0 var(--green-dark);cursor:pointer;touch-action:manipulation;
  transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--green-dark)}
.btn.big{padding:18px 14px;font-size:18px;border-radius:20px}
.btn.secondary{background:#fff;color:var(--green-dark);box-shadow:0 5px 0 var(--line)}
.btn.secondary:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.btn.slim{padding:11px;font-size:15px}
.btn.subtle{background:transparent;color:var(--soft);box-shadow:none;font-weight:700}
.btn.subtle:active{transform:none;box-shadow:none;opacity:.7}
.btn:disabled{opacity:.45;pointer-events:none}

/* home */
.hero{padding-top:14px}
.mascot{width:200px;max-width:68%;height:auto;filter:drop-shadow(0 10px 18px rgba(27,77,51,.18))}

/* doorgeven & rol */
.passname{font-size:clamp(34px,11vw,48px);font-weight:800;overflow-wrap:anywhere;margin:2px 0 12px}
.holdzone{background:#fff;border:3px dashed var(--mint);border-radius:26px;min-height:310px;
  display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;
  touch-action:none;-webkit-touch-callout:none;box-shadow:0 8px 22px rgba(27,77,51,.07)}
.holdzone.active{border-style:solid;border-color:var(--green);background:#F2FBF5}
.rolemoji{font-size:56px;line-height:1.1;margin-bottom:10px}
.bigword{font-size:clamp(30px,9.5vw,44px);font-weight:800;line-height:1.15;overflow-wrap:anywhere;margin:6px 0}
@keyframes pop{from{transform:scale(.82);opacity:0}to{transform:scale(1);opacity:1}}
.pop{animation:pop .32s cubic-bezier(.34,1.56,.64,1)}
.revealname{font-size:24px;font-weight:800;margin:4px 0;overflow-wrap:anywhere}

/* categoriekiezer */
.catgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.catcard{background:#fff;border-radius:18px;padding:14px 8px;text-align:center;
  box-shadow:0 4px 0 var(--line);cursor:pointer;transition:transform .06s,box-shadow .06s}
.catcard:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.catcard .em{font-size:32px;line-height:1.2}
.catcard .nm{font-weight:800;font-size:14px;line-height:1.2;margin-top:4px}
.catcard .ct{color:var(--soft);font-size:12px;margin-top:2px}

/* spelers */
.prow{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:2px solid #F0FAF3}
.prow:last-child{border-bottom:none}
.ava{width:40px;height:40px;border-radius:50%;flex:none;display:flex;align-items:center;
  justify-content:center;font-weight:800;font-size:18px;color:#fff}
.pname{flex:1;font-weight:700;overflow-wrap:anywhere}
.del{width:34px;height:34px;border-radius:50%;flex:none;border:0;background:var(--coral-soft);
  color:#E05252;font:inherit;font-weight:800;cursor:pointer}
.addrow{display:flex;gap:10px}
input{flex:1;min-width:0;background:#fff;border:2px solid var(--line);border-radius:16px;
  padding:13px 14px;font:inherit;color:var(--ink);outline:none;
  user-select:text;-webkit-user-select:text}
input:focus{border-color:var(--green)}
input::placeholder{color:#A9CDB8}
.addbtn{width:56px;flex:none;font-size:24px;padding:0;border-radius:16px}

/* instellingen */
.srow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;font-weight:700}
.srow.cat{border-top:2px solid #F0FAF3;cursor:pointer}
.catname{overflow-wrap:anywhere}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:38px;height:38px;border-radius:50%;border:2px solid var(--mint);
  background:#fff;color:var(--green-dark);font:inherit;font-weight:800;font-size:20px;
  line-height:1;cursor:pointer;touch-action:manipulation}
.stepper button:active{background:var(--chip)}
.stepper b{min-width:2ch;text-align:center;font-size:18px}
.switch{width:50px;height:28px;border-radius:14px;background:#CFE3D6;position:relative;flex:none;transition:background .15s}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.switch.on{background:var(--green)}
.switch.on::after{left:25px}
.check{width:28px;height:28px;border-radius:50%;flex:none;border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:800}
.check.on{background:var(--green);border-color:var(--green)}
.two{display:flex;gap:10px;margin-top:12px}
.two .btn{flex:1}

/* scorebord & woord-editor */
.rank{width:28px;text-align:center;font-weight:800;color:var(--soft);flex:none}
.delta{background:var(--chip);color:var(--green-dark);border-radius:999px;padding:2px 9px;font-weight:800;font-size:13px;flex:none}
.score{font-weight:800;font-size:18px;min-width:2ch;text-align:right;flex:none}
.wrow{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:2px solid #F0FAF3}
.wrow:last-child{border-bottom:none}
.wtxt{flex:1;overflow-wrap:anywhere;cursor:pointer}
.wedit{flex:1;padding:9px 12px;border-radius:12px}
.mini{width:40px;height:40px;flex:none;border:0;border-radius:12px;font:inherit;font-weight:800;font-size:17px;cursor:pointer}
.mini.ok{background:var(--green);color:#fff}
.mini.nope{background:var(--coral-soft);color:#E05252}
.editcat{width:34px;height:34px;border-radius:50%;flex:none;border:0;background:var(--chip);color:var(--green-dark);font:inherit;font-size:15px;cursor:pointer}
.srow .catname{flex:1}

/* toast */
#toast{position:fixed;left:14px;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));
  background:#1B4D33;color:#fff;border-radius:18px;padding:13px 16px;font-weight:700;z-index:60;
  transform:translateY(160%);transition:transform .22s ease;box-shadow:0 10px 24px rgba(27,77,51,.3)}
#toast.show{transform:none}
.hidden{display:none}

/* kleur-utilities als laatste, zodat ze altijd winnen */
.soft{color:var(--soft)}
.red{color:var(--coral)}
.orange{color:var(--orange)}

@media (prefers-reduced-motion: reduce){
  .pop{animation:none}
  .btn,.catcard,.switch,.switch::after,#toast{transition:none}
}
</style>
</head>
<body>
<header id="topbar"><span id="tb-left"></span><span id="tb-right"></span></header>
<main id="screen"></main>
<div id="toast"></div>
<script src="./words.js"></script>
<script src="./app.js"></script>
</body>
</html>
